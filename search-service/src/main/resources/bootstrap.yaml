spring:
  application:
    name: search-service
  profiles:
    active: dev
  feign:
    circuitbreaker:
      enabled: true
  cloud:
    sentinel:
      eager: true
      filter:
        enabled: true
      transport:
        # 只填主机名，端口由这里的 `:8090` 补上；host 的值见 application-dev.yaml
        dashboard: ${haalan.sentinel.transport.host:localhost}:8090
    nacos:
      server-addr: ${NACOS_HOST:nacos}:8848
      config:
        file-extension: yaml # 文件后缀名
        shared-configs: # 共享配置
          - dataId: share-jdbc.yaml # 共享mybatis配置
          - dataId: share-log.yaml # 共享日志配置
          - dataId: share-swagger.yaml # 共享 swagger 配置
          - dataId: share-redis.yaml
#          - dataId: share-seata.yaml
#          - dataId: rabbit.yaml