haalan:
  db:
    host: mysql8
    pw: 123456
    user: root
  redis:
    host: redis
    password: 123456
  es:
    # 必须带端口。EsProperties.host 直接交给 HttpHost.create()，
    # 写成 "es" 时端口是 -1，Apache HttpClient 会退化成 http 默认端口 80，
    # 而 ES 监听的是 9200，结果就是 Connection refused。
    host: es:9200
  sentinel:
    transport:
      # 只填「控制台主机」，端口由 bootstrap.yaml 的 `:8090` 补上。
      # search-service 依赖 haalan-api，所以也有 sentinel 客户端；
      # 此前没配这个值，默认落到 localhost:8090（容器内没有控制台）而连不上。
      host: sentinel-dashboard