haalan:
  db:
    host: mysql8
    pw: 123456
    user: root
  redis:
    host: redis
    password: 123456
  es:
    # 必须带端口。EsProperties.host 直接交给 HttpHost.create()，
    # 写成 "es" 时端口是 -1，Apache HttpClient 会退化成 http 默认端口 80，
    # 而 ES 监听的是 9200，结果就是 Connection refused。
    host: es:9200
  mq:
    host: mq
  seata:
    nacoshost: nacos
  sentinel:
    transport:
      # 这里只填「控制台主机」，端口由 bootstrap.yaml 的 `:8090` 补上。
      # 原来写成 192.168.100.133:8090，拼出 dashboard=192.168.100.133:8090:8090，
      # Sentinel 的 TransportConfig 只接受「恰好一个冒号」的地址，会直接丢弃，
      # 日志里出现 WARNING Parse port of dashboard server failed。
      # 改成容器名后与宿主机 IP 解耦，换机器不用改。
      host: sentinel-dashboard