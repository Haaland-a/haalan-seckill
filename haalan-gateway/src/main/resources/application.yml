spring:
  application:
    name: gateway
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.loadbalancer: DEBUG

server:
  port: 8080

haalan:
  jwt:
    location: classpath:haalan.jks
    # ⚠️ 安全提示：这是 JKS 密钥库口令，已随 git 公开到 GitHub。
    # 网关与 user-service 从同一个 classpath 加载 haalan.jks，改口令必须同步改
    # ①本文件 ②user-service/src/main/resources/application.yaml ③重新生成 haalan.jks
    # ④两个服务都重新部署（hd gateway、hd user-service），否则 JWT 验签失败、全线 401。
    # 用户 VM 未开，本轮只加注释不改值；建议 VM 开后用 keytool 重建密钥库并轮换。
    password: haalan123
    alias: haalan
    tokenTTL: 2h
  redis:
    host: 192.168.100.133
    port: 6379
    password: 123456
  auth:
    # /inner/** 一律禁止从网关外部访问（见 InnerApiGuardFilter）：
    # item-service 的内部接口挂在 /api/product/inner/**，而网关的 item 路由是 /api/product/**，
    # 不拦的话任何登录用户都能调用 addStock 直接改库存。
    blockedPaths:
      - /**/inner/**
      - /api/product/inner/**
    excludePaths:
      # 真实搜索路径是 /api/product/search（search-service 的 ProductSearchController），
      # 原来写的 /search/** 永远匹配不上，等于白名单没生效。
      - /api/product/search
      - /api/user/login
      - /api/user/register
      - /api/payment/callback/**
      - /api/admin/login

