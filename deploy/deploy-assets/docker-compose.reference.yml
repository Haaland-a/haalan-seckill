services:
  # ==================== 基础中间件 ====================
  mysql:
    image: mysql:8.0.33
    container_name: mysql8
    ports:
      - "3306:3306"
    volumes:
      - /data/mysql8:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    networks:
      - haalan
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --requirepass 123456
    networks:
      - haalan
    restart: always

  nacos:
    image: nacos/nacos-server:v2.1.0-slim
    container_name: nacos
    volumes:
      - nacos-data:/home/nacos/data
    env_file:
      - ./nacos/custom.env
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    networks:
      - haalan
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "true"]
      interval: 30s
      timeout: 10s
      retries: 1
      start_period: 60s

    

  es:
    image: elasticsearch:7.12.1
    container_name: es
    environment:
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - "discovery.type=single-node"
    volumes:
      - es-data:/usr/share/elasticsearch/data
      - es-plugins:/usr/share/elasticsearch/plugins
    privileged: true
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      - haalan
    restart: always

  kibana:
    image: kibana:7.12.1
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://es:9200
    ports:
      - "5601:5601"
    networks:
      - haalan
    restart: always
    depends_on:
      - es

  mq:
    image: rabbitmq:3.8-management
    container_name: mq
    hostname: mq
    environment:
      RABBITMQ_DEFAULT_USER: haalan
      RABBITMQ_DEFAULT_PASS: haalan
      RABBITMQ_DEFAULT_VHOST: /haalan          # 加上这行
    volumes:
      - mq-data:/var/lib/rabbitmq
      - mq-plugins:/plugins
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - haalan
    restart: always

  seata:
    image: seataio/seata-server:1.6.1
    container_name: seata
    ports:
      - "7099:7099"
      - "8099:8099"
    environment:
      SEATA_PORT: 8099
      SEATA_IP: 192.168.100.133
    volumes:
      - /root/seata:/seata-server/resources
    privileged: true
    networks:
      - haalan
    restart: always
    depends_on:
      - mysql
      - nacos
  
  # ==================== 调度中心 ====================
  xxl-job-admin:
    image: xuxueli/xxl-job-admin:2.4.1
    container_name: xxl-job-admin
    ports:
      - "8079:8080"  # 宿主机8079映射容器内8080
    environment:
      PARAMS: --spring.datasource.url=jdbc:mysql://mysql8:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
              --spring.datasource.username=root
              --spring.datasource.password=123456
    networks:
      - haalan
    restart: always
    depends_on:
      - mysql

  # ==================== 微服务 ====================
  gateway:
    build:
      context: ./haalan
      dockerfile: haalan-gateway/Dockerfile
    container_name: gateway
    ports:
      - "8080:8080"
    environment:
      - NACOS_HOST=nacos
    networks:
      - haalan
    restart: always
    depends_on:
      nacos:
        condition: service_healthy

  user-service:
    build:
      context: ./haalan
      dockerfile: user-service/Dockerfile
    container_name: user-service
    environment:
      - NACOS_HOST=nacos
    networks:
      - haalan
    restart: always
    depends_on:
      - gateway

  item-service:
    build:
      context: ./haalan
      dockerfile: item-service/Dockerfile
    container_name: item-service
    environment:
      - NACOS_HOST=nacos
    networks:
      - haalan
    restart: always
    depends_on:
      - gateway

  order-service:
    build:
      context: ./haalan
      dockerfile: order-service/Dockerfile
    container_name: order-service
    environment:
      - NACOS_HOST=nacos
    networks:
      - haalan
    restart: always
    depends_on:
      - gateway

  search-service:
    build:
      context: ./haalan
      dockerfile: search-service/Dockerfile
    container_name: search-service
    environment:
      - NACOS_HOST=nacos
    networks:
      - haalan
    restart: always
    depends_on:
      - gateway

  seckill-service:
    build:
      context: ./haalan
      dockerfile: seckill-service/Dockerfile
    container_name: seckill-service
    environment:
      - NACOS_HOST=nacos
    networks:
      - haalan
    restart: always
    depends_on:
      - gateway

  frontend:
    build: ./haalan_
    container_name: frontend
    ports:
      - "80:80"
    networks:
      - haalan
    restart: always
    depends_on:
      - gateway

  admin:
    build: ./haalan-admin
    container_name: haalan-admin
    ports:
      - "81:81"
    networks:
      - haalan
    restart: always
    depends_on:
      - gateway

volumes:
  redis-data:
  es-data:
  es-plugins:
  mq-data:
  mq-plugins:
  nacos-data:    

networks:
  haalan: