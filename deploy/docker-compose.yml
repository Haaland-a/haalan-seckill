# =============================================================================
#  haalan 秒杀商城 —— 自包含一键部署编排
#  ---------------------------------------------------------------------------
#  这份文件里的每个取值都来自对 192.168.100.133 的实测，不是照抄旧文件。
#  改动点都在注释里标了原因。
#
#  ── 项目名 / 数据复用（最关键的一节）────────────────────────────────────
#  文件里不写顶层 `name:`，项目名由同目录 .env 的 COMPOSE_PROJECT_NAME 决定：
#
#    · 现有这台虚拟机：COMPOSE_PROJECT_NAME=root
#      → 网络算作 root_haalan，卷算作 root_redis-data / root_es-data /
#        root_es-plugins / root_mq-data / root_mq-plugins / root_nacos-data。
#        这 6 个卷和 1 个网络正是当前 15 个容器正在用的那一套，所以数据
#        零丢失（RabbitMQ 的 haalan 用户与 /haalan vhost、ES 索引、
#        Nacos 的 14 条配置全在里面）。
#
#    · 换一台全新机器：把 COMPOSE_PROJECT_NAME 留空或改成别的名字，
#      compose 会按目录名新建一整套网络与卷，从零拉起。
#
#  ── 构建上下文与 jar 的关系 ──────────────────────────────────────────────
#  6 个后端的构建上下文是 `..`（= 仓库根 haalan/），Dockerfile 里写的是
#      COPY <svc>/target/<svc>-0.0.1-SNAPSHOT.jar app.jar
#  实测确认：仓库根的 .dockerignore 里那行 `target/` 只匹配上下文根目录的
#  target/，不会匹配 <svc>/target/。所以镜像构建前必须先在宿主机
#  `mvn -o clean package -DskipTests` 产出 jar —— 这条链路已在服务器上
#  实测跑通（增量 15s，全量 clean 26s）。
#
#  ── 首次建库 ────────────────────────────────────────────────────────────
#  ./deploy-assets/sql/*.sql 挂到 mysql 的 docker-entrypoint-initdb.d。
#  只在 /data/mysql8 为空时执行，已有数据的机器上不会被动。
#
#  ── 常用命令（在本文件所在目录执行）─────────────────────────────────────
#    docker compose config                       # 只校验语法，不碰容器
#    docker compose up -d                        # 全量启动 / 增量更新
#    docker compose up -d --build gateway        # 只重建 gateway
#    docker compose up -d --build gateway user-service   # 重建多个
#    docker compose ps                           # 看状态
#    docker compose --profile tools up -d        # 额外起 Sentinel 控制台
# =============================================================================

# ---------------------------------------------------------------------------
#  微服务公共片段（6 个服务共用，避免重复 6 份）
# ---------------------------------------------------------------------------
x-backend-common: &backend-common
  restart: always
  networks: [haalan]
  environment:
    - NACOS_HOST=nacos
    # 与 docker-compose.apps.yml 保持一致：JVM 参数按服务分级，写在各服务自己的
    # environment 里（YAML 的 << 不深合并 environment，服务一旦自己声明就会整体
    # 覆盖，所以每个服务都必须重复写 NACOS_HOST）。
    #
    # 服务器 7.8 GB / 18 个容器 / 实测 available 仅 336 MB。老配置
    # （统一 -Xms256m -Xmx512m -XX:MaxMetaspaceSize=192m）的真正问题不只在堆：
    # 64 位 JVM 默认 ReservedCodeCacheSize=240m、MaxDirectMemorySize≈Xmx，
    # 6 个服务自己就预留约 5 GB。现在每个服务都封顶了堆外三块，并带
    # -XX:+ExitOnOutOfMemoryError，让 OOM 时退出交给 restart 而不是反复 Full GC。
    # 详见 docker-compose.apps.yml 顶部注释。
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:

  # =========================================================================
  #  基础中间件
  # =========================================================================
  mysql:
    image: mysql:8.0.33
    container_name: mysql8
    ports: ["3306:3306"]
    volumes:
      - /data/mysql8:/var/lib/mysql
      - ./deploy-assets/sql:/docker-entrypoint-initdb.d:ro
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: always
    networks: [haalan]

  redis:
    image: redis:7
    container_name: redis
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
    command: redis-server --requirepass ${REDIS_PASSWORD:-123456} --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-123456}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always
    networks: [haalan]

  nacos:
    image: nacos/nacos-server:v2.1.0-slim
    container_name: nacos
    volumes: [nacos-data:/home/nacos/data]
    env_file: [./deploy-assets/nacos/custom.env]
    ports: ["8848:8848", "9848:9848", "9849:9849"]
    depends_on:
      mysql: {condition: service_healthy}
    healthcheck:
      # 旧编排写的是 test: ["CMD","true"]，等于永远健康，起不到等待作用，
      # 后端会在 Nacos 还没起来时就冲进去注册而失败。这里换成真实探针。
      test: ["CMD-SHELL", "curl -sf http://localhost:8848/nacos/v1/console/health/readiness || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 90s
    restart: always
    networks: [haalan]

  es:
    image: elasticsearch:7.12.1
    container_name: es
    environment:
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - discovery.type=single-node
    volumes:
      - es-data:/usr/share/elasticsearch/data
      - es-plugins:/usr/share/elasticsearch/plugins
    # 旧编排用的是 privileged: true；这里换成最小权限的 ulimits，更安全且够用。
    ulimits:
      memlock: {soft: -1, hard: -1}
      nofile: {soft: 65536, hard: 65536}
    ports: ["9200:9200", "9300:9300"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: always
    networks: [haalan]

  kibana:
    image: kibana:7.12.1
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://es:9200
    ports: ["5601:5601"]
    depends_on:
      es: {condition: service_healthy}
    restart: always
    networks: [haalan]

  mq:
    image: rabbitmq:3.8-management
    container_name: mq
    hostname: mq
    environment:
      RABBITMQ_DEFAULT_USER: ${MQ_USER:-haalan}
      RABBITMQ_DEFAULT_PASS: ${MQ_PASSWORD:-haalan}
      RABBITMQ_DEFAULT_VHOST: /haalan
    volumes:
      - mq-data:/var/lib/rabbitmq
      - mq-plugins:/plugins
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: always
    networks: [haalan]

  seata:
    image: seataio/seata-server:1.6.1
    container_name: seata
    ports: ["7099:7099", "8099:8099"]
    environment:
      SEATA_PORT: 8099
      # Seata 注册到 Nacos 的 IP，必须是业务容器能访问到的宿主机 IP。
      # 换机器时改 .env 里的 HOST_IP。
      SEATA_IP: ${HOST_IP:-192.168.100.133}
    volumes:
      - ./deploy-assets/seata:/seata-server/resources
    depends_on:
      mysql: {condition: service_healthy}
      nacos: {condition: service_healthy}
    restart: always
    networks: [haalan]

  xxl-job-admin:
    image: xuxueli/xxl-job-admin:2.4.1
    container_name: xxl-job-admin
    ports: ["8079:8080"]
    environment:
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://mysql8:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
        --spring.datasource.username=root
        --spring.datasource.password=${MYSQL_ROOT_PASSWORD:-123456}
    depends_on:
      mysql: {condition: service_healthy}
    restart: always
    networks: [haalan]

  # =========================================================================
  #  可选：Sentinel 控制台（默认不启动，加 --profile tools 才起）
  #  服务器上目前没有这个镜像（8090 端口是关的），需要先准备镜像：
  #    见 deploy-assets/sentinel/README.md 的两种做法
  # =========================================================================
  sentinel-dashboard:
    image: ${SENTINEL_IMAGE:-haalan/sentinel-dashboard:1.8.6}
    container_name: sentinel-dashboard
    profiles: [tools]
    ports: ["8090:8090"]
    restart: always
    networks: [haalan]

  # =========================================================================
  #  微服务（构建上下文 `..` = 仓库根 haalan/）
  # =========================================================================
  gateway:
    <<: *backend-common
    environment:
      - NACOS_HOST=nacos
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx256m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=64m -XX:MaxDirectMemorySize=192m -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError
    build:
      context: ..
      dockerfile: haalan-gateway/Dockerfile
    container_name: gateway
    ports: ["8080:8080"]
    depends_on:
      nacos: {condition: service_healthy}
      redis: {condition: service_healthy}

  user-service:
    <<: *backend-common
    environment:
      - NACOS_HOST=nacos
      - JAVA_TOOL_OPTIONS=-Xms160m -Xmx320m -XX:MaxMetaspaceSize=160m -XX:ReservedCodeCacheSize=96m -XX:MaxDirectMemorySize=96m -XX:+ExitOnOutOfMemoryError
    build:
      context: ..
      dockerfile: user-service/Dockerfile
    container_name: user-service
    depends_on:
      gateway: {condition: service_started}
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      mq: {condition: service_healthy}

  item-service:
    <<: *backend-common
    environment:
      - NACOS_HOST=nacos
      - JAVA_TOOL_OPTIONS=-Xms192m -Xmx384m -XX:MaxMetaspaceSize=160m -XX:ReservedCodeCacheSize=96m -XX:MaxDirectMemorySize=160m -XX:+ExitOnOutOfMemoryError
    build:
      context: ..
      dockerfile: item-service/Dockerfile
    container_name: item-service
    depends_on:
      gateway: {condition: service_started}
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      mq: {condition: service_healthy}
      es: {condition: service_healthy}

  order-service:
    <<: *backend-common
    environment:
      - NACOS_HOST=nacos
      - JAVA_TOOL_OPTIONS=-Xms192m -Xmx384m -XX:MaxMetaspaceSize=160m -XX:ReservedCodeCacheSize=96m -XX:MaxDirectMemorySize=128m -XX:+ExitOnOutOfMemoryError
    build:
      context: ..
      dockerfile: order-service/Dockerfile
    container_name: order-service
    depends_on:
      gateway: {condition: service_started}
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      mq: {condition: service_healthy}

  search-service:
    <<: *backend-common
    environment:
      - NACOS_HOST=nacos
      - JAVA_TOOL_OPTIONS=-Xms160m -Xmx320m -XX:MaxMetaspaceSize=160m -XX:ReservedCodeCacheSize=96m -XX:MaxDirectMemorySize=128m -XX:+ExitOnOutOfMemoryError
    build:
      context: ..
      dockerfile: search-service/Dockerfile
    container_name: search-service
    depends_on:
      gateway: {condition: service_started}
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      es: {condition: service_healthy}

  seckill-service:
    <<: *backend-common
    environment:
      - NACOS_HOST=nacos
      - JAVA_TOOL_OPTIONS=-Xms192m -Xmx384m -XX:MaxMetaspaceSize=160m -XX:ReservedCodeCacheSize=96m -XX:MaxDirectMemorySize=96m -XX:+ExitOnOutOfMemoryError
    build:
      context: ..
      dockerfile: seckill-service/Dockerfile
    container_name: seckill-service
    depends_on:
      gateway: {condition: service_started}
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      mq: {condition: service_healthy}

  # =========================================================================
  #  前端 / 管理端（构建上下文是各自仓库目录）
  # =========================================================================
  frontend:
    build:
      context: ../../haalan_
      dockerfile: Dockerfile
    container_name: frontend
    ports: ["80:80"]
    depends_on:
      gateway: {condition: service_started}
    restart: always
    networks: [haalan]

  admin:
    build:
      context: ../../haalan-admin
      dockerfile: Dockerfile
    container_name: haalan-admin
    ports: ["81:81"]
    depends_on:
      gateway: {condition: service_started}
    restart: always
    networks: [haalan]

volumes:
  redis-data:
  es-data:
  es-plugins:
  mq-data:
  mq-plugins:
  nacos-data:

networks:
  haalan:
    driver: bridge
