# =============================================================================
#  haalan 应用层编排（只含 6 个微服务 + 2 个前端，不含中间件）
#  ---------------------------------------------------------------------------
#  为什么要单独有这份文件：
#     在现有这台虚拟机上，中间件（mysql8 / redis / nacos / es / kibana / mq /
#     seata / xxl-job-admin）已经在跑，而且带着数据。用包含中间件的完整编排
#     执行 `docker compose up -d` 会把它们**全部重建**（实测 dry-run 确认），
#     这违反「不许关闭、修改任何容器」的约束。
#
#     所以日常迭代只用这份 apps 文件：它只声明 8 个应用服务，
#     通过 external network 接入已经存在的 root_haalan 网络，
#     `up -d` 只会动应用容器，中间件一个都不碰。
#
#  ── 用法（在 haalan/deploy/ 目录下）──────────────────────────────────────
#      # 先在仓库根编译 jar
#      cd .. && mvn -o clean package -DskipTests && cd deploy
#
#      # 只重建并替换某个服务
#      docker compose -f docker-compose.apps.yml up -d --build gateway
#      docker compose -f docker-compose.apps.yml up -d --build user-service
#      docker compose -f docker-compose.apps.yml up -d --build frontend admin
#
#      # 全部 8 个应用
#      docker compose -f docker-compose.apps.yml up -d --build
#
#      # 看状态
#      docker compose -f docker-compose.apps.yml ps
#
#  ── 安全保证 ────────────────────────────────────────────────────────────
#      · 网络用 external，compose 不会创建/删除网络
#      · 不声明任何 volumes，不会碰数据卷
#      · 不声明中间件服务，up/--build 都不会波及它们
#      · 不加 --remove-orphans，就不会去清理别的容器
#
#  换机器时：把 .env 里的 HAALAN_NETWORK 改成目标机器上实际的网络名，
#           中间件用 docker-compose.yml（完整版）另起一套。
# =============================================================================

# ---------------------------------------------------------------------------
#  微服务公共片段
# ---------------------------------------------------------------------------
x-backend-common: &backend-common
  restart: always
  networks: [haalan]
  environment:
    - NACOS_HOST=nacos
    # ── JVM 内存预算（2 核 / 7.8 GB 的机器上共跑 18 个容器）─────────────────
    # 实测：容器 RSS 合计 6.6 GiB，free -m 的 available 只剩 336 MB。
    #
    # 各服务的 JAVA_TOOL_OPTIONS 写在下面每个服务自己的 environment 里
    # （YAML 的 << 合并不会深合并 environment，服务一旦自己声明就会整体覆盖，
    #  所以每个服务都必须重复写 NACOS_HOST）。
    #
    # 为什么以前 RSS 远大于堆：容器 RSS 里除了堆，还有三块「堆外」——
    #   7 × Metaspace 192m             = 1344 MB（上限）
    #   7 × ReservedCodeCacheSize 240m = 1680 MB（64 位 JVM 默认值，没显式封顶）
    #   7 × DirectMemory ≈ Xmx         = 3584 MB（默认等于 -Xmx）
    # 也就是说老配置下 JVM 自己就预留了 6.5 GB，只调 -Xmx 是不够的。
    # 新配置对这三块都显式封了顶，分级依据是各服务实际负载：
    #   秒杀 / 订单 / 商品  —— 有热点数据、ES 客户端、Seata AT  undo_log，给 384m
    #   用户 / 搜索         —— 中等，给 320m
    #   网关 / 购物车       —— 无状态转发 + Redis/单表，给 256m / 288m
    # 堆上限合计由 3584 MB 降到 2336 MB。
    #
    # 两类 GC 的选择：
    #   小堆服务（网关/用户/搜索/购物车）用 -XX:+UseSerialGC —— 64 位默认的 G1
    #     需要 Remembered Set 等辅助数据结构，小堆上纯属额外常驻开销；
    #   大一点的三个服务保持默认 G1。
    #
    # 每个服务都加了 -XX:+ExitOnOutOfMemoryError：堆爆时立刻退出，交给上面的
    # restart: always 重新拉起，而不是让 JVM 反复 Full GC 把整机内存吃干
    # （老配置没这个参数，是后者）。
    #
    # 想恢复 JVM 默认值，把对应服务 environment 里那行改成空即可：
    #   - JAVA_TOOL_OPTIONS=
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:

  # 网关：无状态转发，没有任何业务数据常驻；Netty 的直接内存是主要开销，
  # 所以堆压得最低、但 -XX:MaxDirectMemorySize 反而给得比谁都宽。
  gateway:
    <<: *backend-common
    environment:
      - NACOS_HOST=nacos
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx256m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=64m -XX:MaxDirectMemorySize=192m -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError
    build:
      context: ..
      dockerfile: haalan-gateway/Dockerfile
    image: root-gateway:latest
    container_name: gateway
    ports: ["8080:8080"]

  user-service:
    <<: *backend-common
    environment:
      - NACOS_HOST=nacos
      - JAVA_TOOL_OPTIONS=-Xms160m -Xmx320m -XX:MaxMetaspaceSize=160m -XX:ReservedCodeCacheSize=96m -XX:MaxDirectMemorySize=96m -XX:+ExitOnOutOfMemoryError
    build:
      context: ..
      dockerfile: user-service/Dockerfile
    image: root-user-service:latest
    container_name: user-service

  # 商品服务：同时持有 MyBatis-Plus、ES 高阶客户端（RestHighLevelClient）
  # 和同步商品的定时任务，堆最高的一档。
  item-service:
    <<: *backend-common
    environment:
      - NACOS_HOST=nacos
      - JAVA_TOOL_OPTIONS=-Xms192m -Xmx384m -XX:MaxMetaspaceSize=160m -XX:ReservedCodeCacheSize=96m -XX:MaxDirectMemorySize=160m -XX:+ExitOnOutOfMemoryError
    build:
      context: ..
      dockerfile: item-service/Dockerfile
    image: root-item-service:latest
    container_name: item-service

  # 订单服务：Seata AT 全局事务，undo_log / 分支事务要留在堆里，
  # 是不能压太狠的一个。
  order-service:
    <<: *backend-common
    environment:
      - NACOS_HOST=nacos
      - JAVA_TOOL_OPTIONS=-Xms192m -Xmx384m -XX:MaxMetaspaceSize=160m -XX:ReservedCodeCacheSize=96m -XX:MaxDirectMemorySize=128m -XX:+ExitOnOutOfMemoryError
    build:
      context: ..
      dockerfile: order-service/Dockerfile
    image: root-order-service:latest
    container_name: order-service

  search-service:
    <<: *backend-common
    environment:
      - NACOS_HOST=nacos
      - JAVA_TOOL_OPTIONS=-Xms160m -Xmx320m -XX:MaxMetaspaceSize=160m -XX:ReservedCodeCacheSize=96m -XX:MaxDirectMemorySize=128m -XX:+ExitOnOutOfMemoryError
    build:
      context: ..
      dockerfile: search-service/Dockerfile
    image: root-search-service:latest
    container_name: search-service

  # 秒杀服务：压测时 QPS 305 的热点，但数据几乎全在 Redis，
  # 堆内没有大对象，用 G1 而不是 SerialGC 以应对突发分配。
  seckill-service:
    <<: *backend-common
    environment:
      - NACOS_HOST=nacos
      - JAVA_TOOL_OPTIONS=-Xms192m -Xmx384m -XX:MaxMetaspaceSize=160m -XX:ReservedCodeCacheSize=96m -XX:MaxDirectMemorySize=96m -XX:+ExitOnOutOfMemoryError
    build:
      context: ..
      dockerfile: seckill-service/Dockerfile
    image: root-seckill-service:latest
    container_name: seckill-service

  # 购物车：纯 Redis + 单表，无热点数据，堆和 GC 都能压到最低。
  cart-service:
    <<: *backend-common
    environment:
      - NACOS_HOST=nacos
      - JAVA_TOOL_OPTIONS=-Xms144m -Xmx288m -XX:MaxMetaspaceSize=144m -XX:ReservedCodeCacheSize=64m -XX:MaxDirectMemorySize=64m -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError
    build:
      context: ..
      dockerfile: cart-service/Dockerfile
    image: root-cart-service:latest
    container_name: cart-service

  frontend:
    build:
      context: ../../haalan_
      dockerfile: Dockerfile
    image: root-frontend:latest
    container_name: frontend
    ports: ["80:80"]
    restart: always
    networks: [haalan]

  admin:
    build:
      context: ../../haalan-admin
      dockerfile: Dockerfile
    image: root-admin:latest
    container_name: haalan-admin
    ports: ["81:81"]
    restart: always
    networks: [haalan]

networks:
  haalan:
    external: true
    name: ${HAALAN_NETWORK:-root_haalan}
