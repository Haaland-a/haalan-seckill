haalan:
  db:
    host: mysql8
    pw: 123456
    user: root
  redis:
    host: redis
    password: 123456
  es:
    # 必须带端口。EsProperties.host 直接交给 HttpHost.create()，
    # 写成 "es" 时端口是 -1，Apache HttpClient 会退化成 http 默认端口 80，
    # 而 ES 监听的是 9200，结果就是 Connection refused。
    host: es:9200
  mq:
    host: mq
  seata:
    nacoshost: nacos
  sentinel:
    transport:
      # 原来是硬编码宿主机 IP，换机器要改；改成容器名后与宿主机解耦。
      host: sentinel-dashboard