haalan:
  db:
    host: mysql8
    pw: 123456
    user: root
  redis:
    host: redis
    password: 123456
  es:
    # 必须带端口。EsProperties.host 直接交给 HttpHost.create()，
    # 写成 "es" 时端口是 -1，Apache HttpClient 会退化成 http 默认端口 80，
    # 而 ES 监听的是 9200，结果就是 Connection refused。
    host: es:9200
  mq:
    host: mq
  seata:
    nacoshost: nacos
  sentinel:
    transport:
      # 同 item-service：只填主机名，端口由 bootstrap.yaml 补 :8090。
      # 原值 192.168.100.133:8090 会拼成 192.168.100.133:8090:8090 而被丢弃。
      host: sentinel-dashboard
  xxl:
    admin:
      addresses: http://xxl-job-admin:8080/xxl-job-admin
    accessToken: default_token
    executor:
      appname: seckill-service
      port: 9085